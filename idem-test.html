<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>保存タイムアウト安全処理 検証</title>
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; margin: 0; background: #f6f6f8; color: #1f1f1f; }
  header { background: #7a4a1b; color: #fff; padding: 12px 16px; }
  header h1 { font-size: 16px; margin: 0; } header p { font-size: 11px; margin: 4px 0 0; opacity: .9; }
  main { padding: 12px 16px 48px; max-width: 760px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid #e2e2e6; border-radius: 10px; padding: 14px; margin: 12px 0; }
  .card h2 { font-size: 14px; margin: 0 0 10px; }
  label { display: block; font-size: 12px; font-weight: 600; margin: 10px 0 4px; }
  select, input[type=text], input[type=password] {
    width: 100%; box-sizing: border-box; font-size: 15px; padding: 9px 10px;
    border: 1px solid #c9c9cf; border-radius: 8px; background: #fff; }
  select:disabled, input:disabled { background: #eef0f2; color: #999; }
  .chk { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; }
  .chk input { width: 20px; height: 20px; }
  button { font-size: 14px; font-weight: 700; padding: 11px 12px; border: 0; border-radius: 9px;
    background: #7a4a1b; color: #fff; cursor: pointer; width: 100%; margin-top: 10px; }
  button.big { background: #1b7a42; font-size: 15px; } button.alt { background: #2a5db4; } button.warn { background: #b4232a; }
  button.mini { width: auto; padding: 6px 12px; font-size: 12px; margin: 0; }
  button:disabled { background: #cfcfcf; color: #8a8a8a; cursor: not-allowed; }
  .note { font-size: 11px; color: #666; line-height: 1.5; margin: 6px 0 0; }
  .red { color: #b4232a; font-weight: 600; }
  .state { font-size: 16px; font-weight: 800; padding: 12px; border-radius: 10px; margin: 8px 0; text-align: center; }
  .state small { display: block; font-size: 12px; font-weight: 600; margin-top: 4px; }
  .s-idle { background: #eef0f2; color: #555; }
  .s-processing { background: #fff6e0; color: #8a6d1b; }
  .s-saved { background: #e6f7ec; color: #1b7a42; }
  .s-unconfirmed { background: #eef3ff; color: #2a5db4; }
  .s-unknown { background: #fdeaea; color: #b4232a; }
  .s-mismatch { background: #fff0e6; color: #b45a1b; }
  .log { background: #0e1116; color: #d6e2ff; font-family: ui-monospace, Menlo, monospace;
    font-size: 11px; line-height: 1.5; padding: 10px; border-radius: 8px; white-space: pre-wrap;
    word-break: break-all; max-height: 320px; overflow: auto; }
  .ok { color: #38d16a; } .ng { color: #ff6a6a; } .dim { color: #8aa; } .hi { color: #ffd479; } .warnc { color: #ffb366; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>保存タイムアウト時の安全処理 検証（架空データ）</h1>
  <p>saved:false は「未保存確定」とせず「現時点で保存を確認できない」と扱います。自動再送はしません。</p>
</header>

<main>
  <div class="card">
    <h2>接続設定（処理中は変更不可）</h2>
    <label>店舗</label>
    <select id="store">
      <option value="yatsushiro">八代店 (yatsushiro)</option>
      <option value="youme-yatsushiro">ゆめタウン八代店 (youme-yatsushiro)</option>
      <option value="uto-city">宇土シティ店 (uto-city)</option>
    </select>
    <label>テストトークン（実行時のみ・端末に保存しません）</label>
    <input id="token" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="テストトークンを貼り付け">
    <label>登録キー（clientKey＝冪等キー・自動生成）</label>
    <div class="row" style="align-items:center">
      <input id="clientKey" type="text" readonly>
      <button id="genKey" class="alt mini" style="flex:0 0 auto">新規</button>
    </div>
    <div class="chk"><input type="checkbox" id="simDrop"><label for="simDrop" style="margin:0">テスト：保存されないケースを模擬（未保存→手動再送の確認用）</label></div>
  </div>

  <div class="card">
    <h2>現在の保存状態</h2>
    <div id="state" class="state s-idle">未実行<small>①検証開始を押してください</small></div>
    <p class="note red">状態＝ 処理中／保存済み／保存を確認できない／結果不明。saved:false は即「未保存」と断定しません。</p>
  </div>

  <div class="card">
    <h2>安全フロー検証</h2>
    <p class="note">① 事前照会(ok&saved:false)が取れた時のみ write 開始 → 遅延15秒write（10秒で打切り）。
      打切り後は【自動再送せず】② 照会で状態を確定します。</p>
    <button id="btnStart" class="big">① 検証開始（事前照会 → 遅延write）</button>
    <button id="btnConfirm" class="alt" disabled>② 保存状態を照会（30秒×最大3回・読取専用）</button>
    <button id="btnResend" disabled>③ 同じ内容で再送（同一キー・同一内容／冪等で安全）</button>
    <button id="btnMismatch" class="warn" disabled>④ 別内容で同一キー再送（内容変更防止テスト／保存済みのみ）</button>
    <button id="btnReset" class="alt" disabled>リセット（新しい検証を始める）</button>
  </div>

  <div class="card">
    <h2>手動（任意・参照用）</h2>
    <button id="mStatus" class="alt">status 照会（書き込まない）</button>
    <button id="mRead" class="alt">自店舗 read（このキーの件数）</button>
    <button id="mClear" class="warn">自店舗データ削除（再テスト用）</button>
  </div>

  <div class="card">
    <h2>ログ</h2>
    <button id="clearLog" class="alt mini" style="margin:0 0 8px">消去</button>
    <div id="log" class="log">—</div>
  </div>
</main>

<script>
(function () {
  'use strict';
  var EXEC = 'https://script.google.com/macros/s/AKfycbz5xLOt9OOGIzhPLFIuVyp43IGiNJDJPVtdMT3DrJ3GHQAVn4G0xtK2_UUT3N-XhdIqcA/exec';
  var WRITE_TIMEOUT   = 10000;  // write打切り（サーバー遅延15秒より短く＝応答喪失を再現）
  var SERVER_DELAY    = 15000;  // write時にサーバーへ送る遅延
  var STATUS_TIMEOUT  = 30000;  // status照会の打切り
  var STATUS_RETRIES  = 3;      // status再試行回数
  var STATUS_INTERVAL = 3000;   // 再試行の待機間隔

  var $ = function (id) { return document.getElementById(id); };
  var logEl = $('log');
  var running = false;          // ネットワーク処理中（連打・多重実行防止）
  var phase = 'idle';           // idle / confirm / saved / unconfirmed / unknown
  var lastKey = '', lastPayload = null;

  function ts(){ return new Date().toISOString().substr(11,12); }
  function log(cls,msg){ if(logEl.textContent==='—')logEl.textContent='';
    var d=document.createElement('div'); if(cls)d.className=cls;
    d.textContent='['+ts()+'] '+msg; logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; }
  function newKey(){ return 'K-'+Date.now()+'-'+Math.random().toString(36).slice(2,7); }
  function mask(o){ var c=JSON.parse(JSON.stringify(o)); if(c.token)c.token='***('+c.token.length+')'; return JSON.stringify(c); }
  function base(extra){ var b={store:$('store').value, token:$('token').value.trim()}; for(var k in extra)b[k]=extra[k]; return b; }
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function pl(){ return {customerName:'遅延 太郎', pickup:'12/24 15:30', items:{7:1}}; }

  function setState(cls, title, sub){ var e=$('state'); e.className='state s-'+cls; e.innerHTML = title + (sub ? '<small>'+sub+'</small>' : ''); }

  // 状態に応じてUIを一元制御（flowOpen＝未解決の保存フローがある）
  function render(){
    var flowOpen = (phase==='confirm' || phase==='unconfirmed' || phase==='unknown');
    var lockInputs = running || flowOpen;
    $('store').disabled = lockInputs;
    $('token').disabled = lockInputs;
    $('genKey').disabled = lockInputs;
    $('simDrop').disabled = lockInputs;
    $('btnStart').disabled    = running || flowOpen;   // 開始は idle / saved のときのみ
    $('btnConfirm').disabled  = running || !(phase==='confirm' || phase==='unconfirmed' || phase==='unknown');
    $('btnResend').disabled   = running || phase!=='unconfirmed';
    $('btnMismatch').disabled = running || phase!=='saved';
    $('btnReset').disabled    = running || phase==='idle';
    $('mStatus').disabled = running;
    $('mRead').disabled   = running;
    $('mClear').disabled  = running || flowOpen;
  }
  function setPhase(p){ phase=p; render(); }
  function setRunning(b){ running=b; render(); }

  // text/plain POST（タイムアウト付き）。戻り: {data, aborted, ms, status}
  function call(body, timeoutMs, label){
    log('dim', label+' → '+mask(body));
    var ctl=new AbortController();
    var timer=setTimeout(function(){ctl.abort();}, timeoutMs);
    var t0=performance.now();
    return fetch(EXEC,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(body),redirect:'follow',credentials:'omit',signal:ctl.signal})
      .then(function(r){return r.text().then(function(t){return {status:r.status,text:t};});})
      .then(function(res){ clearTimeout(timer); var ms=Math.round(performance.now()-t0);
        var data; try{data=JSON.parse(res.text);}catch(e){data=null;}
        if(data) log(data.ok?'ok':'ng', label+' 応答('+res.status+','+ms+'ms): '+JSON.stringify(data));
        else log('ng', label+' 応答('+res.status+','+ms+'ms): JSON以外 '+res.text.slice(0,120));
        return {data:data, aborted:false, ms:ms, status:res.status}; })
      .catch(function(e){ clearTimeout(timer); var ms=Math.round(performance.now()-t0);
        if(e&&e.name==='AbortError'){ log('hi', label+' 打切り('+ms+'ms)'); return {data:null,aborted:true,ms:ms}; }
        log('ng', label+' 失敗('+ms+'ms): '+e); return {data:null,aborted:false,ms:ms,error:String(e)}; });
  }

  // ---- ① 検証開始：事前照会ガード → 遅延write（打切り後は自動再送しない） ----
  $('btnStart').onclick = function(){
    if (running || phase==='confirm' || phase==='unconfirmed' || phase==='unknown') return;
    var tok=$('token').value.trim(); if(!tok){ log('ng','トークン未入力'); return; }
    var key=newKey(); $('clientKey').value=key; lastKey=key; lastPayload=pl();
    var simDrop = $('simDrop').checked;
    setRunning(true);
    setState('processing','検証中…','事前照会');
    log('hi','=== 検証開始 clientKey='+key+(simDrop?' [保存されない模擬]':'')+' ===');
    call(base({action:'status',clientKey:key}), STATUS_TIMEOUT, '① 事前status')
    .then(function(pre){
      // 事前照会ガード: ok:true かつ saved:false を確認できた時だけ write
      if(!pre.data || !pre.data.ok){
        setRunning(false); setPhase('idle');
        setState('unknown','中止：事前照会に失敗','通信エラー/タイムアウト。writeは実行しません');
        return null;
      }
      if(pre.data.saved){
        setRunning(false); setPhase('saved');
        setState('saved','中止：既に保存済み','このキーは保存済み。writeは実行しません');
        return null;
      }
      return call(base({action:'write',clientKey:key,delayMs:SERVER_DELAY,simulateNoSave:simDrop,payload:lastPayload}), WRITE_TIMEOUT, '② 遅延write(10秒打切り)');
    })
    .then(function(w){
      if(w===null){ return; }
      setRunning(false);
      if (w.data && w.data.ok && !w.data.simulatedNoSave){
        setPhase('saved'); setState('saved','保存済み','遅延なく応答・二重登録なし');
        log('ok','writeが成功応答。保存済み。');
      } else if (w.aborted || (w.data && w.data.simulatedNoSave)){
        setPhase('confirm');
        setState('unknown','結果不明（確認中）','writeの結果が不明です。自動再送しません。②で照会してください');
        log('hi','writeの応答が得られない/未保存模擬。→「②保存状態を照会」を押してください');
      } else {
        setPhase('confirm'); setState('unknown','通信エラー','②で照会してください');
      }
    });
  };

  // ---- ② 保存状態の照会（読取専用・リトライ・自動再送しない・時間で未保存断定しない） ----
  function confirmStatus(key){
    var transient = 0;
    function attempt(n){
      setState('processing','照会中…',''+n+'/'+STATUS_RETRIES+' 回目');
      return call(base({action:'status',clientKey:key}), STATUS_TIMEOUT, 'status#'+n)
      .then(function(res){
        if (res.data && res.data.ok){
          if (res.data.saved){
            var sub = (transient>0) ? ('通信が一時的に不安定でした（照会リトライ'+transient+'回）。二重登録なし')
                                    : ('通信遅延のみ。二重登録なし');
            setPhase('saved'); setState('saved','保存済み', sub);
            log('ok','照会で saved:true を確認。'+sub); return 'saved';
          }
          // saved:false ＝「現時点で保存を確認できない」。時間では未保存断定しない。
          if (n < STATUS_RETRIES){
            setState('processing','保存を確認できません','処理中の可能性。再照会します…');
            return wait(STATUS_INTERVAL).then(function(){ return attempt(n+1); });
          }
          setPhase('unconfirmed');
          setState('unconfirmed','保存を確認できません','処理中/未保存の可能性。③同じ内容の再送は安全です（同一キー・冪等で二重登録しません）');
          log('ok','照会は成功したが saved:false。未保存断定せず「確認できない」。③手動再送（冪等）を許可');
          return 'unconfirmed';
        }
        // status自体がタイムアウト/失敗 → 結果不明（再送しない）
        transient++;
        if (n < STATUS_RETRIES){
          setState('unknown','照会失敗（再試行）',''+n+'回目失敗。'+Math.round(STATUS_INTERVAL/1000)+'秒後に再試行');
          return wait(STATUS_INTERVAL).then(function(){ return attempt(n+1); });
        }
        setPhase('unknown');
        setState('unknown','結果不明','照会できませんでした。再送しないでください。時間をおいて②を再実行');
        log('ng','status照会が'+STATUS_RETRIES+'回とも失敗。結果不明。再送は無効のまま'); return 'unknown';
      });
    }
    return attempt(1);
  }
  $('btnConfirm').onclick = function(){
    if(running || !lastKey) return;
    setRunning(true);
    confirmStatus(lastKey).then(function(){ setRunning(false); });
  };

  // ---- ③ 同じ内容で再送（unconfirmed時のみ・同一キー同一内容・冪等で安全） ----
  $('btnResend').onclick = function(){
    if(running || phase!=='unconfirmed' || !lastKey || !lastPayload) return;
    setRunning(true);
    call(base({action:'write',clientKey:lastKey,payload:lastPayload}), STATUS_TIMEOUT, '③ 同内容で再送(冪等)')
    .then(function(w){
      setRunning(false);
      if (w.data && w.data.ok){
        setPhase('saved');
        setState('saved','保存済み', w.data.duplicate ? '既に保存済みでした（二重登録なし）' : '再送で保存しました（元は未保存でした）');
      } else { setPhase('unconfirmed'); setState('unknown','再送結果不明','時間をおいて②で照会してください'); }
    });
  };

  // ---- ④ 別内容で同一キー再送（保存済みのみ・内容変更防止の検証） ----
  $('btnMismatch').onclick = function(){
    if(running || phase!=='saved' || !lastKey) return;
    var diff = {customerName:'別人 花子', pickup:'12/25 10:00', items:{8:2}};
    setRunning(true);
    call(base({action:'write',clientKey:lastKey,payload:diff}), STATUS_TIMEOUT, '④ 別内容で同一キー再送')
    .then(function(w){
      setRunning(false); setPhase('saved');
      if (w.data && w.data.ok && w.data.contentMismatch===true){
        setState('mismatch','内容変更は拒否（既存を保持）','contentMismatch:true＝上書きせず。通常の保存成功とは別の結果です');
        log('ok','contentMismatch:true＝既存を上書きせず保持（意図しない内容変更を防止）');
      } else if (w.data && w.data.ok && w.data.contentMismatch===false){
        setState('unknown','想定外','差分が検出されませんでした（contentMismatch:false）');
        log('ng','contentMismatch:false（別内容のはずが差分未検出）');
      } else { setState('unknown','④結果不明','時間をおいて確認してください'); }
    });
  };

  // ---- リセット ----
  $('btnReset').onclick = function(){
    if(running) return;
    lastKey=newKey(); lastPayload=null; $('clientKey').value=lastKey;
    setPhase('idle'); setState('idle','未実行','①検証開始を押してください');
    log('dim','リセット。新しいキー='+lastKey);
  };

  // ---- 手動（参照用） ----
  $('genKey').onclick=function(){ if(running||$('genKey').disabled)return; lastKey=newKey(); $('clientKey').value=lastKey; log('dim','登録キー: '+lastKey); };
  $('mStatus').onclick=function(){ if(running)return; setRunning(true); var k=$('clientKey').value||lastKey; call(base({action:'status',clientKey:k}), STATUS_TIMEOUT, 'status').then(function(){ setRunning(false); }); };
  $('mRead').onclick=function(){ if(running)return; setRunning(true); call(base({action:'read'}), STATUS_TIMEOUT, 'read').then(function(){ setRunning(false); }); };
  $('mClear').onclick=function(){ if(running)return; setRunning(true); call(base({action:'clear_mine'}), STATUS_TIMEOUT, 'clear_mine').then(function(){ setRunning(false); }); };
  $('clearLog').onclick=function(){ logEl.textContent='—'; };

  lastKey=newKey(); $('clientKey').value=lastKey;
  render();
  log('dim','origin='+location.origin+' / writeTimeout='+WRITE_TIMEOUT+' statusTimeout='+STATUS_TIMEOUT+' retries='+STATUS_RETRIES);
})();
</script>
</body>
</html>
