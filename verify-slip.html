<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>帳票机上検証</title>
<style>
  :root { --bg:#f4f4f4; --fg:#111; --ok:#0a7a2f; --ng:#c0161f; --card:#fff; --line:#ccc; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font-family:"Hiragino Sans",sans-serif; }
  h1 { font-size:18px; margin:0 0 4px; }
  .note { font-size:12px; color:#555; margin:0 0 12px; }
  #summary { font-size:16px; font-weight:bold; padding:8px 12px; border-radius:6px; display:inline-block; }
  #summary.pass { background:#e3f5e8; color:var(--ok); } #summary.fail { background:#fde4e4; color:var(--ng); }
  pre { background:var(--card); border:1px solid var(--line); padding:10px; font-size:12px; max-height:340px; overflow:auto; white-space:pre-wrap; }
  .tabs button { margin:0 6px 6px 0; padding:6px 10px; font-size:13px; border:1px solid var(--line); background:var(--card); border-radius:4px; }
  .tabs button.on { background:#111; color:#fff; }
  .grid { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start; }
  figure { margin:0; background:var(--card); border:1px solid var(--line); padding:8px; max-width:100%; }
  figcaption { font-size:12px; margin-bottom:6px; }
  figcaption .ng { color:var(--ng); font-weight:bold; }
  canvas { display:block; width:288px; max-width:100%; height:auto; border:1px solid #999; image-rendering:pixelated; }
  label { font-size:12px; }
</style></head>
<body>
<h1>帳票机上検証（bt-public / Canvas 576dot）</h1>
<p class="note">このページは描画命令を記録して受付区分非印字・店舗名・付属品・支払丸囲み・白紙・折返し欠落・セル超過を検査し、プレビューを表示します。
外部送信・印刷はしません。合格は実機（mC-Print3）での寸法・文字・罫線・3枚排紙の合格ではありません。</p>
<div id="summary">running</div>
<pre id="out"></pre>
<div class="tabs" id="tabs"></div>
<label><input type="checkbox" id="showIssues" checked> 検出箇所を赤枠で表示</label>
<div class="grid" id="preview"></div>

<script src="../poc/js/StarWebPrintBuilder.js"></script>
<script src="src/slip-master.js"></script>
<script src="src/slip-template.js"></script>
<script src="src/sample-data.js"></script>
<script src="tools/slip-verify-core.js"></script>
<script>
(function () {
  'use strict';
  var M = CY.master, S = CY.slipTemplate, SD = CY.sampleData.build, V = CY.slipVerify;

  function make(opts) {
    var probe = document.createElement('canvas'); probe.width = S.LAYOUT.W; probe.height = 10;
    var h = S.render(probe.getContext('2d'), opts, true).height;
    var canvas = document.createElement('canvas'); canvas.width = S.LAYOUT.W; canvas.height = h;
    var rec = new V.Recorder(canvas.getContext('2d'), null);
    var result = S.render(rec, opts, false);
    return { rec: rec, result: result, canvas: canvas };
  }
  var mc = document.createElement('canvas').getContext('2d');
  var res;
  try {
    res = V.run({ S: S, M: M, SD: SD, make: make, measureCtx: new V.Recorder(mc, null), realFont: true });
  } catch (e) {
    document.getElementById('summary').textContent = 'ERROR: ' + e.message; document.getElementById('summary').className = 'fail';
    document.getElementById('out').textContent = e.stack; return;
  }
  var lines = res.lines, fails = res.fails;
  function ok(c, t, d) { lines.push((c ? 'ok   ' : 'FAIL ') + t + (!c && d ? '\n       ' + d : '')); if (!c) fails++; }

  // 実ピクセル: 白紙出力でない・白黒2値（グレー/色がない）
  lines.push(''); lines.push('[実ピクセル]');
  var pixBad = [], grayBad = [];
  res.slips.forEach(function (x) {
    var img = x.canvas.getContext('2d').getImageData(0, 0, x.canvas.width, x.canvas.height).data, dark = 0, n = img.length / 4;
    for (var i = 0; i < img.length; i += 4) if (img[i] < 128) dark++;
    if (dark / n < 0.02) pixBad.push(x.scenario + '/' + x.kind + ' ' + (100 * dark / n).toFixed(2) + '%');
    x.darkPct = (100 * dark / n).toFixed(1);
  });
  ok(pixBad.length === 0, '全帳票の黒画素率 ≥ 2%（白紙出力なし）', pixBad.join(', '));
  // 備考の白紙部（見出し下・枠線の内側3dot）を実ピクセルで検査: 64mm(512dot)以上の高さで、白以外の画素が0
  var rmPixBad = [];
  res.slips.forEach(function (x) {
    var rr = x.result.remark && x.result.remark.rect;
    if (!rr) { rmPixBad.push(x.scenario + '/' + x.kind + ' 矩形なし'); return; }
    var ix = rr.x + 3, iy = rr.y + 3, iw = rr.w - 6, ih = rr.h - 6;
    var px = x.canvas.getContext('2d').getImageData(ix, iy, iw, ih).data, nonWhite = 0;
    for (var i = 0; i < px.length; i += 4) if (px[i] < 250 || px[i + 1] < 250 || px[i + 2] < 250) nonWhite++;
    x.remarkMm = (rr.h / 8).toFixed(1);
    if (rr.h < 512 || nonWhite > 0) rmPixBad.push(x.scenario + '/' + x.kind + ' 高さ' + rr.h + 'dot 非白' + nonWhite + 'px');
  });
  ok(rmPixBad.length === 0, '実ピクセル: 全帳票の備考白紙が64mm(512dot)以上かつ完全白（非白画素0）', rmPixBad.slice(0, 5).join(', '));
  // SDK リクエスト（送信しない）
  var jobs = S.buildAll(SD());
  ok(jobs.length === 9 && jobs.every(function (j) { return /<cutpaper[^>]*type="partial"/.test(j.request) && /<bitimage[^>]*width="576"/.test(j.request); }),
     'buildAll 9ジョブ・各576dot・パーシャルカット（送信なし）');
  lines.push(''); lines.push('[計測（実フォント・標準サンプル）]');
  var total = 0;
  jobs.forEach(function (j) { total += j.heightDots; lines.push('  ' + j.name + ': ' + j.heightDots + 'dot / ' + j.heightMm + 'mm / ' + (j.bytes / 1024).toFixed(1) + 'KB'); });
  lines.push('  合計: ' + total + 'dot / ' + Math.round(total / 8) + 'mm / ' + jobs.length + '枚');
  lines.push(''); lines.push('RESULT=' + (fails ? 'FAIL(' + fails + ')' : 'PASS'));

  var sum = document.getElementById('summary');
  sum.textContent = fails ? 'FAIL（' + fails + '件）' : 'PASS（机上・実フォント）';
  sum.className = fails ? 'fail' : 'pass';
  document.getElementById('out').textContent = lines.join('\n');

  // ---- プレビュー
  var scen = [];
  res.slips.forEach(function (x) { if (scen.indexOf(x.scenario) < 0) scen.push(x.scenario); });
  var cur = scen[0];
  function name(x) {
    if (x.kind === 'customer') return '引換証（お客様控え）';
    if (x.kind === 'store') return '受注書（店舗控え）';
    return '貼付用 ' + M.productByNo(x.opts.unit.no).mark + ' ' + x.opts.unit.seq + '/' + x.opts.unit.total;
  }
  function draw() {
    var tabs = document.getElementById('tabs'); tabs.innerHTML = '';
    scen.forEach(function (s) {
      var b = document.createElement('button'); b.textContent = s; b.className = s === cur ? 'on' : '';
      b.onclick = function () { cur = s; draw(); }; tabs.appendChild(b);
    });
    var pv = document.getElementById('preview'); pv.innerHTML = '';
    var showIssues = document.getElementById('showIssues').checked;
    res.slips.filter(function (x) { return x.scenario === cur; }).forEach(function (x) {
      var fig = document.createElement('figure'), cap = document.createElement('figcaption');
      cap.innerHTML = name(x) + ' — ' + x.result.height + 'dot / ' + Math.round(x.result.height / 8) + 'mm / 黒' + x.darkPct + '% / 備考白紙' + x.remarkMm + 'mm' +
        (x.issues.length ? ' <span class="ng">検出' + x.issues.length + '件</span>' : '');
      var c = document.createElement('canvas'); c.width = x.canvas.width; c.height = x.canvas.height;
      var g = c.getContext('2d'); g.drawImage(x.canvas, 0, 0);
      if (showIssues) {
        g.strokeStyle = 'rgba(220,0,0,.9)'; g.lineWidth = 2;
        x.issues.forEach(function (is) { if (is.box) g.strokeRect(is.box.l - 1, is.box.t - 1, is.box.r - is.box.l + 2, is.box.b - is.box.t + 2); });
      }
      fig.appendChild(cap); fig.appendChild(c); pv.appendChild(fig);
    });
  }
  document.getElementById('showIssues').onchange = draw;
  draw();
}());
</script></body></html>
